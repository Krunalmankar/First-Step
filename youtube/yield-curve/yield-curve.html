<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SimpleMoney · The Yield Curve</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* SimpleMoney tokens (Ledger theme), from the design system's tokens.json */
:root {
  --paper:#F3F2EC; --paper-edge:#DEDDD3; --page:#FBFAF6; --page-rim:#E7E6DD; --rule:#D6DCE6; --margin:#E8A598;
  --ink:#1B2233; --ink-soft:#5B6274; --ink-faint:#8E93A0; --pen:#2340A0; --on-pen:#F3F2EC;
  --marker:#F5C52E; --on-marker:#1B2233; --gain:#13734F; --loss:#C4432C; --night-panel:#0F1424;
  --font-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --font-text:"Figtree","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",Menlo,monospace;
  --radius-tag:6px; --radius-chip:10px; --radius-tile:14px; --radius-pill:9999px;
  --page-lift:0 36px 70px -26px rgba(27,34,51,.28),0 2px 6px rgba(27,34,51,.08);
  --button-lift:0 14px 28px -10px rgba(35,64,160,.50);
}
html,body { margin:0; background:var(--paper); }
#stage { position:relative; width:1920px; height:1080px; overflow:hidden; color:var(--ink); font-family:var(--font-text);
  background:radial-gradient(ellipse 78% 72% at 50% 44%, var(--paper) 52%, var(--paper-edge) 100%); }
.grid { position:absolute; inset:0; opacity:.6;
  background-image:linear-gradient(var(--rule) 2px,transparent 2px),linear-gradient(90deg,var(--rule) 2px,transparent 2px);
  background-size:60px 60px; background-position:-2px 18px;
  -webkit-mask-image:radial-gradient(ellipse 70% 65% at 50% 50%,#000 30%,transparent 100%); }
.layer, .scene { position:absolute; inset:0; }
.p { position:absolute; }
.c { text-align:center; }
svg.full { position:absolute; left:0; top:0; overflow:visible; }

/* explainer frame */
.header { position:absolute; top:84px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:24px; }
.header .title { font-family:var(--font-display); font-weight:800; font-size:64px; line-height:1; letter-spacing:-.02em; color:var(--ink); }
.header .rule { width:3px; height:44px; background:var(--ink-faint); opacity:.5; }
.header .kick { color:var(--pen); }
.header .count { color:var(--ink-faint); }
.card { position:absolute; left:370px; top:192px; width:1180px; height:492px; border-radius:var(--radius-tile); box-shadow:var(--page-lift); overflow:hidden;
  background:repeating-linear-gradient(to bottom, var(--page) 0, var(--page) 58px, var(--rule) 58px, var(--rule) 60px); }
.card::before { content:""; position:absolute; top:0; bottom:0; left:120px; width:3px; background:var(--margin); }
.caption { position:absolute; left:96px; right:96px; top:718px; text-align:center; font-family:var(--font-display); font-weight:800; font-size:72px; line-height:1.1; letter-spacing:-.01em; white-space:nowrap; }
.caption .w { display:inline-block; }
.dots { position:absolute; top:962px; left:0; right:0; display:flex; justify-content:center; align-items:center; gap:12px; }
.dots i { width:12px; height:12px; border-radius:var(--radius-pill); background:var(--pen); }
.dots i.on { width:34px; }
.dots i.todo { background:var(--ink-faint); opacity:.45; }
.nav { position:absolute; left:0; right:0; bottom:0; height:62px; background:var(--pen); }
.nav .tab { position:absolute; top:0; height:62px; width:320px; display:flex; align-items:center; justify-content:center; font-family:var(--font-text); font-weight:600; font-size:26px; color:var(--on-pen); }
.nav .tab.on { color:var(--pen); font-weight:700; }
.nav .cut { position:absolute; top:0; height:62px; width:320px; background:var(--paper); border-top:3px solid var(--pen); box-sizing:border-box; }

/* type */
.mono { font-family:var(--font-mono); font-weight:500; font-size:26px; letter-spacing:.16em; text-transform:uppercase; }
.micro { font-family:var(--font-mono); font-weight:500; font-size:18px; letter-spacing:.12em; text-transform:uppercase; line-height:1.2; }
.label { font-family:var(--font-text); font-weight:700; font-size:52px; line-height:1.2; letter-spacing:-.01em; color:var(--pen); }
.statement { font-family:var(--font-text); font-weight:700; font-size:80px; line-height:1.15; letter-spacing:-.01em; color:var(--ink); }
.body { font-family:var(--font-text); font-weight:600; font-size:56px; line-height:1.35; color:var(--ink); }
.text { font-family:var(--font-text); font-weight:600; font-size:30px; line-height:1.3; color:var(--ink); }
.sub { font-family:var(--font-text); font-weight:600; font-size:30px; color:var(--ink-soft); }
.disp { font-family:var(--font-display); font-weight:800; letter-spacing:-.02em; line-height:1; }
.fig { font-family:var(--font-mono); font-weight:600; font-size:52px; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.section-word { font-family:var(--font-display); font-weight:800; font-size:180px; line-height:1; letter-spacing:-.02em; color:var(--ink); }
.pen { color:var(--pen); } .soft { color:var(--ink-soft); } .faint { color:var(--ink-faint); } .gain { color:var(--gain); } .loss { color:var(--loss); }

.chip { display:inline-flex; align-items:center; gap:10px; padding:14px 20px; border-radius:var(--radius-chip); font-family:var(--font-text); font-weight:600; font-size:26px; line-height:1; white-space:nowrap; }
.chip-pen { background:var(--pen); color:var(--on-pen); }
.chip-marker { background:var(--marker); color:var(--on-marker); }
.chip-out { background:var(--page); color:var(--ink); box-shadow:inset 0 0 0 2px var(--page-rim); }
.chip-gain { background:var(--page); color:var(--gain); box-shadow:inset 0 0 0 3px var(--gain); }
.chip-loss { background:var(--page); color:var(--loss); box-shadow:inset 0 0 0 3px var(--loss); }
.tag { display:inline-block; padding:6px 10px; border-radius:var(--radius-tag); font-family:var(--font-mono); font-weight:500; font-size:17px; letter-spacing:.12em; text-transform:uppercase; line-height:1.1; white-space:nowrap; background:var(--page); }
.tag-ink { color:var(--ink); border:2px solid var(--ink); }
.tag-pen { color:var(--pen); border:2px solid var(--pen); }
.tag-loss { color:var(--loss); border:2px solid var(--loss); }
.tag-gain { color:var(--gain); border:2px solid var(--gain); }
.tag-assumed { color:var(--ink-soft); border:2px dashed var(--ink-soft); }
.tag-asof { color:var(--pen); border:2px solid var(--pen); }
.tile { display:inline-flex; align-items:center; justify-content:center; flex:none; width:64px; height:64px; border-radius:var(--radius-tile); box-shadow:inset 0 0 0 3px var(--pen); color:var(--pen); font-family:var(--font-mono); font-weight:600; font-size:30px; }
.stat { position:absolute; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:12px; padding:22px 18px 20px; border-radius:var(--radius-tile); background:var(--page); box-shadow:var(--page-lift); }
.box { position:absolute; box-sizing:border-box; border-radius:var(--radius-tile); background:var(--page); box-shadow:var(--page-lift); }

.mark { position:relative; display:inline-block; padding:0 .12em; z-index:0; }
.mark .swipe { position:absolute; left:-.02em; right:-.02em; top:.16em; bottom:.06em; background:var(--marker); border-radius:.14em .4em .28em .2em; z-index:-1; transform-origin:0 50%; transform:scaleX(0); }
.strike { position:relative; display:inline-block; }
.strike .line { position:absolute; left:-4%; right:-4%; top:52%; height:6px; border-radius:3px; background:var(--loss); transform-origin:0 50%; transform:scaleX(0); }

.svgtext { font-family:var(--font-mono); font-weight:500; font-size:16px; letter-spacing:.1em; fill:var(--ink-soft); }
.svglab { font-family:var(--font-mono); font-weight:600; font-size:18px; letter-spacing:.06em; }
.ln { fill:none; stroke:var(--ink); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
.btn { display:inline-flex; align-items:center; padding:26px 42px; border-radius:var(--radius-pill); font-family:var(--font-display); font-weight:800; font-size:44px; color:var(--ink); background:var(--page); box-shadow:inset 0 0 0 3px var(--page-rim); }
.btn-primary { background:var(--pen); color:var(--on-pen); box-shadow:var(--button-lift); }
</style>
</head>
<body>
<div id="stage">
  <div class="grid"></div>
  <div class="layer" id="frame">
    <div class="card" id="card"></div>
    <div class="header" id="header"><span class="title" id="hTitle"></span><span class="rule"></span><span class="mono kick" id="hKick"></span><span class="rule"></span><span class="mono count" id="hCount"></span></div>
    <div class="caption" id="caption"></div>
    <div class="dots" id="dots"></div>
    <div class="nav" id="nav"><div class="cut" id="navCut"></div></div>
  </div>
  <div class="layer" id="scenes"></div>
</div>
<script src="data.js"></script>
<script>
// ---------------------------------------------------------------------------
// Timeline: every time below is in seconds of the ORIGINAL narration track.
// The disclaimer card plays first, so the voice is delayed by OFF seconds.
// ---------------------------------------------------------------------------
const OFF = 4.0;
const END_CARD = 10.0;
const VOICE_LEN = 708.67;
const DURATION = OFF + VOICE_LEN + END_CARD;
const DATA = window.YC_DATA;

const BEAT_IN = 0.45, BEAT_OUT = 0.30, WORD_STEP = 0.14;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const bez = (p1x, p1y, p2x, p2y) => x => { let t = x; for (let i = 0; i < 8; i++) { const cx = 3*p1x*t*(1-t)**2 + 3*p2x*t*t*(1-t) + t**3 - x; const d = 3*p1x*(1-t)**2 + 6*(p2x-p1x)*t*(1-t) + 3*(1-p2x)*t*t; if (Math.abs(d) < 1e-6) break; t = clamp(t - cx/d); } return 3*p1y*t*(1-t)**2 + 3*p2y*t*t*(1-t) + t**3; };
const settle = bez(0.22, 1, 0.36, 1), push = bez(0.65, 0, 0.35, 1);
const COLORS = { ink:'#1B2233', soft:'#5B6274', faint:'#8E93A0', pen:'#2340A0', loss:'#C4432C', gain:'#13734F' };
const hex = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i]-v)*k)).join(',')})`; };
const $ = id => document.getElementById(id);
const fmtNum = (v, dec, plus) => (v < 0 ? '−' : (plus && v > 0 ? '+' : '')) + Math.abs(v).toFixed(dec);

const NAV = ['Basics', 'Inversion', 'History', 'The twist', 'Today', "What's next"];
const SECS = [null,
  ['What is a yield curve', 'More time, more yield'],
  ['The flip', 'Short above long'],
  ['Why it inverts', 'Rates and expectations'],
  ['Expectations', 'What markets expect'],
  ['The track record', 'Seven warnings'],
  ['The big mistake', 'A light, not a clock'],
  ['The twist', '2022 to 2024'],
  ['Un-inversion', 'After the flip'],
  ['October 2026', 'Where we are now'],
  ['The 2026 dashboard', 'Five gauges'],
  ['Putting it together', 'The reading'],
  ['The 2027 scenario', 'Hypothetical'],
  ['Five red alerts', 'What to watch'],
  ['Is 2027 the year?', 'Nobody knows the month'],
];

// ---------------------------------------------------------------------------
// Scene helpers
// ---------------------------------------------------------------------------
const SC = [];
// kind 'board' = full paper board; 'frame' = inside the explainer frame (header, ledger card, caption, nav)
function scene(t0, t1, kind, opt, build, update) { SC.push({ t0, t1, kind, ...opt, build, update }); }
const at = (t) => `data-in="${t}"`;
// absolutely positioned block; o.c centres on x with width w
function P(x, y, html, o = {}) {
  const w = o.w ? `width:${o.w}px;` : '';
  const left = o.c ? x - (o.w || 0) / 2 : x;
  return `<div class="p ${o.c ? 'c ' : ''}${o.cls || ''}" style="left:${left}px;top:${y}px;${w}${o.style || ''}" ${o.in != null ? at(o.in) : ''}${o.out != null ? ` data-out="${o.out}"` : ''}>${html}</div>`;
}
const mark = (txt, t) => `<span class="mark"><span class="swipe" data-swipe="${t}"></span>${txt}</span>`;
const strike = (txt, t) => `<span class="strike">${txt}<span class="line" data-strike="${t}"></span></span>`;
const count = (from, to, dec, t, dur, plus, pre = '', suf = '') => `<span data-count="${from},${to},${dec},${t},${dur},${plus ? 1 : 0}" data-pre="${pre}" data-suf="${suf}">${pre}${fmtNum(to, dec, plus)}${suf}</span>`;
const svg = (inner) => `<svg class="full" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true">${inner}</svg>`;
let UID = 0;

// chart frame: returns X/Y mappers and the axes markup
function plot(c) {
  const X = t => c.x + (t - c.tx[0]) / (c.tx[1] - c.tx[0]) * c.w;
  const Y = v => c.y + c.h - (v - c.vy[0]) / (c.vy[1] - c.vy[0]) * c.h;
  let s = `<g ${at(c.in)}>`;
  (c.rec || []).forEach(([a, b]) => { const x0 = Math.max(X(a), c.x), x1 = Math.min(X(b), c.x + c.w); if (x1 > x0) s += `<rect x="${x0}" y="${c.y}" width="${Math.max(x1 - x0, 3)}" height="${c.h}" fill="#1B2233" opacity=".07"/>`; });
  (c.yt || []).forEach(([v, l]) => { s += `<line x1="${c.x}" x2="${c.x + c.w}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)" stroke-width="2"/><text x="${c.x - 14}" y="${Y(v) + 6}" text-anchor="end" class="svgtext">${l}</text>`; });
  (c.xt || []).forEach(([t, l]) => { s += `<text x="${X(t)}" y="${c.y + c.h + 32}" text-anchor="middle" class="svgtext">${l}</text>`; });
  if (c.zero) s += `<line x1="${c.x}" x2="${c.x + c.w}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink-faint)" stroke-width="2.5"/>`;
  s += '</g>';
  return { X, Y, s, c };
}
// a data series, revealed left to right; below zero it turns into the loss colour with a soft fill
function series(P_, data, o = {}) {
  const { X, Y, c } = P_;
  const pts = data.filter(p => p[0] >= c.tx[0] && p[0] <= c.tx[1]);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)} ${Y(Math.max(c.vy[0], Math.min(c.vy[1], p[1]))).toFixed(1)}`).join('');
  const id = ++UID, col = o.color || 'var(--pen)', w = o.w || 5;
  let s = `<clipPath id="rv${id}"><rect x="${c.x - 10}" y="0" width="0" height="1080" data-reveal="${o.t},${o.dur || 1.6},${c.w + 20}"/></clipPath>`;
  s += `<g clip-path="url(#rv${id})" ${o.in != null ? at(o.in) : ''}>`;
  if (o.loss) {
    const z = Y(0);
    const area = `M${X(pts[0][0])} ${z}` + pts.map(p => `L${X(p[0]).toFixed(1)} ${Math.max(z, Y(Math.max(c.vy[0], p[1]))).toFixed(1)}`).join('') + `L${X(pts[pts.length - 1][0])} ${z}Z`;
    s += `<clipPath id="bz${id}"><rect x="0" y="${z}" width="1920" height="1080"/></clipPath>`;
    s += `<path d="${area}" fill="var(--loss)" opacity=".16"/>`;
    s += `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" ${o.dash ? `stroke-dasharray="${o.dash}"` : ''}/>`;
    s += `<path d="${d}" fill="none" stroke="var(--loss)" stroke-width="${w}" stroke-linejoin="round" clip-path="url(#bz${id})"/>`;
  } else {
    s += `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${o.dash ? `stroke-dasharray="${o.dash}"` : ''} ${o.op ? `opacity="${o.op}"` : ''}/>`;
  }
  return s + '</g>';
}
const valAt = (data, t) => { let best = data[0]; for (const p of data) { if (Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p; } return best[1]; };
const vline = (x, y0, y1, col, t) => `<line x1="${x}" x2="${x}" y1="${y0}" y2="${y1}" stroke="${col}" stroke-width="2.5" stroke-dasharray="6 6" ${at(t)}/>`;
const bracket = (x0, x1, y, col, t) => `<path d="M${x0} ${y - 12} L${x0} ${y} L${x1} ${y} L${x1} ${y - 12}" fill="none" stroke="${col}" stroke-width="3" ${at(t)}/>`;
// line-art gauge: track, filled arc in pen up to v (0..1), needle that swings in
function gauge(cx, cy, r, v, t, opt = {}) {
  const a0 = Math.PI, arc = (k) => { const a = a0 - Math.PI * k; return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };
  const [sx, sy] = arc(0), [ex, ey] = arc(1), [vx, vy] = arc(v);
  const sw = opt.sw || Math.max(6, r * 0.14);
  return `<g ${at(t)}>
    <path d="M${sx} ${sy} A${r} ${r} 0 0 1 ${ex} ${ey}" fill="none" stroke="var(--rule)" stroke-width="${sw}" stroke-linecap="round"/>
    <path d="M${sx} ${sy} A${r} ${r} 0 0 1 ${vx} ${vy}" fill="none" stroke="${opt.col || 'var(--pen)'}" stroke-width="${sw}" stroke-linecap="round" data-arc="${t + 0.2},0.9"/>
    <g data-rot="${t + 0.2},0.9,-90,${-90 + 180 * v},${cx},${cy}"><line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - r * 0.82}" stroke="var(--ink)" stroke-width="${Math.max(4, r * 0.06)}" stroke-linecap="round"/></g>
    <circle cx="${cx}" cy="${cy}" r="${Math.max(7, r * 0.09)}" fill="var(--page)" stroke="var(--ink)" stroke-width="4"/></g>`;
}
// the five dashboard gauges as a row inside the card
const GAUGES = [
  ['Yield curve', 0.22, 'No inversion', 'chip-gain'],
  ['Jobs', 0.58, 'Weakening', 'chip-marker'],
  ['Inflation', 0.66, 'Stubborn', 'chip-marker'],
  ['Credit', 0.46, 'Watch', 'chip-marker'],
  ['Growth', 0.25, 'Expanding', 'chip-gain'],
];
function gaugeRow(t, active, y = 262, empty = false) {
  let g = '', h = '';
  GAUGES.forEach(([name, v, st, cls], i) => {
    const cx = 640 + i * 190, on = i === active;
    g += `<g opacity="${active == null || on ? 1 : 0.4}">${gauge(cx, y, 44, empty ? 0 : v, t + i * 0.08, { sw: 9 })}</g>`;
    h += P(cx, y + 18, `<div style="opacity:${active == null || on ? 1 : 0.45}"><div class="micro" style="color:var(--ink);font-weight:600">${name}</div>${empty ? '' : `<div class="micro ${cls === 'chip-gain' ? 'gain' : 'soft'}" style="margin-top:6px">${st}</div>`}</div>`, { c: 1, w: 180, in: t + i * 0.08 });
  });
  return svg(g) + h;
}
// icons, line art at 4px
const ICON = {
  bank: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})" class="ln"><path class="ln" d="M-70 -30 L0 -70 L70 -30 Z"/><path class="ln" d="M-60 -20 V40 M-30 -20 V40 M0 -20 V40 M30 -20 V40 M60 -20 V40 M-76 52 H76"/></g>`,
  house: (x, y) => `<g transform="translate(${x} ${y})"><path class="ln" d="M-34 -4 L0 -36 L34 -4 M-24 -12 V30 H24 V-12 M-8 30 V8 H8 V30"/></g>`,
  cardi: (x, y) => `<g transform="translate(${x} ${y})"><rect class="ln" x="-36" y="-24" width="72" height="50" rx="8"/><path class="ln" d="M-36 -8 H36 M-22 12 H0"/></g>`,
  factory: (x, y) => `<g transform="translate(${x} ${y})"><path class="ln" d="M-36 30 V-6 L-14 8 V-6 L8 8 V-6 L30 8 V-34 H36 V30 Z"/></g>`,
  clock: (x, y, r) => `<g transform="translate(${x} ${y})"><circle class="ln" r="${r}"/><path class="ln" d="M0 0 V${-r * 0.6} M0 0 L${r * 0.45} ${r * 0.2}"/></g>`,
  check: (x, y, s = 1, t) => `<path d="M${x - 22 * s} ${y} L${x - 6 * s} ${y + 16 * s} L${x + 24 * s} ${y - 18 * s}" fill="none" stroke="var(--gain)" stroke-width="${7 * s}" stroke-linecap="round" stroke-linejoin="round" ${t != null ? at(t) : ''}/>`,
  cross: (x, y, r, t) => `<g><line x1="${x - r}" y1="${y - r}" x2="${x + r}" y2="${y + r}" stroke="var(--loss)" stroke-width="10" stroke-linecap="round" data-draw="${t},0.25"/><line x1="${x + r}" y1="${y - r}" x2="${x - r}" y2="${y + r}" stroke="var(--loss)" stroke-width="10" stroke-linecap="round" data-draw="${t + 0.18},0.25"/></g>`,
  warn: (x, y) => `<g transform="translate(${x} ${y})"><path d="M0 -20 L20 16 H-20 Z" fill="var(--marker)" stroke="var(--ink)" stroke-width="3.5" stroke-linejoin="round"/><path d="M0 -6 V4" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/><circle cy="10" r="2.2" fill="var(--ink)"/></g>`,
};
const REC = [[1980.0, 1980.5], [1981.5, 1982.87], [1990.5, 1991.2], [2001.2, 2001.87], [2007.95, 2009.5], [2020.12, 2020.3]];
// card content box (right of the margin line)
const CX = 1022, CL = 520, CR = 1520, CT = 214, CB = 664;

// ---------------------------------------------------------------------------
// 0 · Disclaimer (before the voice starts)
// ---------------------------------------------------------------------------
scene(-OFF, 0, 'board', {}, () =>
  P(960, 360, `<div class="mono pen">Before we start</div>`, { c: 1, w: 1600, in: -3.8 }) +
  P(960, 420, `<div class="statement">This is education, not advice.</div>`, { c: 1, w: 1600, in: -3.6 }) +
  P(960, 560, `<div class="sub" style="line-height:1.45">Numbers are examples. Rates and data are as of October 2026 and will change.<br>Talk to a SEBI-registered adviser before you invest.</div>`, { c: 1, w: 1300, in: -3.35 }));

// ---------------------------------------------------------------------------
// Cold open

    rows.map(([txt, now, st, cls], i) => { const y = 250 + i * 82, t = 594.0 + i * 6; return `<div class="p" style="left:530px;top:${y}px;width:990px;height:70px;border-radius:12px;background:var(--page);box-shadow:inset 0 0 0 2px var(--page-rim);display:flex;align-items:center;gap:22px;padding:0 22px;box-sizing:border-box" ${at(t)}>
      <span class="disp pen" style="font-size:40px;width:54px">0${i + 1}</span><span class="text" style="font-size:27px;font-weight:700;flex:1">${txt}</span>
      <span style="text-align:right"><span class="fig" style="font-size:24px;display:block">${now}</span><span class="micro ${cls}" style="font-size:14px">${st}</span></span></div>`; }).join('');
});

// ---------------------------------------------------------------------------
// 14 · Is 2027 the recession year?
// ---------------------------------------------------------------------------
scene(626.5, 633.8, 'board', {}, () =>
  P(960, 330, `<div class="section-word" style="font-size:260px">2027?</div>`, { c: 1, w: 1700, in: 626.7 }) +
  P(960, 640, `<div class="mono pen">Is 2027 the recession year?</div>`, { c: 1, w: 1500, in: 627.3 }));
scene(633.8, 639.0, 'frame', { nav: 5, sec: 14, cap: [[634.0, 'Nobody knows the *month*']] }, () =>
  ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'].map((m, i) =>
    `<div class="box" style="left:${560 + (i % 6) * 160}px;top:${250 + Math.floor(i / 6) * 180}px;width:140px;height:150px;text-align:center" ${at(634.0 + i * 0.08)}><div class="micro soft" style="margin-top:20px">${m}</div><div class="disp faint" style="font-size:64px;margin-top:12px">?</div></div>`).join(''));
scene(639.0, 648.2, 'frame', { nav: 5, sec: 14, cap: [[639.3, 'The better *question*']] }, () =>
  P(CX, 240, `<div class="body soft" style="font-size:40px">${strike('Will there be a recession?', 640.2)}</div>`, { c: 1, w: 1000, in: 639.2 }) +
  P(CX, 320, `<div class="statement" style="font-size:56px">Are the warning lights <span class="pen">getting worse?</span></div>`, { c: 1, w: 1040, in: 641.6 }) +
  gaugeRow(643.4, null, 520));

// ---------------------------------------------------------------------------
// Verdict and close
// ---------------------------------------------------------------------------
scene(648.2, 656.0, 'frame', { nav: 5, sec: 14, secAt: [[648.2, 14, 'The verdict']], cap: [[648.5, 'Where we *stand*']] }, () => {
  const r = [['UST 10-year', '5.27%'], ['UST 2-year', '4.79%'], ['3-month bill', '4.21%'], ['Fed funds', '3.75–4.00%'], ['Unemployment', '4.2%'], ['CPI', '3.7% y/y'], ['Junk bond spread', '≈3 pts'], ['ISM manufacturing', '54.5'], ['ISM services', '54.9']];
  return P(CL, 226, `<span class="tag tag-asof">As of Oct 2026</span>`, { in: 648.3 }) +
    r.map(([n, v], i) => { const col = i < 5 ? 0 : 1, row = i < 5 ? i : i - 5, x = 560 + col * 500, y = 290 + row * 66; return P(x, y, `<span class="text" style="font-size:28px">${n}</span>`, { in: 648.6 + i * 0.25 }) + P(x + 440, y, `<span class="fig" style="font-size:30px">${v}</span>`, { w: 300, style: 'margin-left:-300px;text-align:right', in: 648.6 + i * 0.25 }); }).join('');
});
scene(656.0, 668.0, 'frame', { nav: 5, sec: 14, secAt: [[656, 14, 'The verdict']], cap: [[656.3, 'It warned in *2000*, 2006, 2019']] }, () => {
  const p = spreadAxes([1995, 2027], [-1.3, 3], [[-1, '−1'], [0, '0'], [1, '+1'], [2, '+2'], [3, '+3']], [[2000, '2000'], [2010, '2010'], [2020, '2020']], 656.1);
  return svg(p.s + series(p, DATA.full, { t: 656.2, dur: 1.6, loss: true, w: 4 })) +
    [[2000.1, '2000'], [2005.95, '2006'], [2019.6, '2019']].map(([t, y], i) => P(p.X(t), 268, `<div class="disp" style="font-size:44px">${y}</div><div style="margin-top:6px"><span class="tag tag-pen">Warned</span></div>`, { c: 1, w: 200, in: 657.0 + i * 0.8 })).join('');
});
scene(668.0, 686.0, 'frame', { nav: 5, sec: 14, secAt: [[668, 14, 'The verdict']], cap: [[668.3, 'Five lights to *watch*']] }, () =>
  P(CX, 240, `<div class="label" style="font-size:44px">Today's warning lights</div>`, { c: 1, w: 900, in: 668.2 }) + gaugeRow(668.6, null, 450));
scene(686.0, 690.5, 'frame', { nav: 5, sec: 14, secAt: [[686, 14, 'The verdict']], cap: [] }, () =>
  P(CX, 340, `<div class="statement" style="font-size:54px">So the real question isn't whether a recession is coming…</div>`, { c: 1, w: 1000, in: 686.2 }));
scene(690.5, 695.8, 'frame', { nav: 5, sec: 14, secAt: [[690.5, 14, 'The verdict']], cap: [] }, () =>
  P(CX, 330, `<div class="statement" style="font-size:72px">Which warning light turns <span class="loss">red</span> first?</div>`, { c: 1, w: 1040, in: 690.7 }));
scene(695.8, VOICE_LEN, 'frame', { nav: 5, sec: 14, secAt: [[695.8, 14, 'The verdict']], cap: [[696.1, 'Watch the *lights*, not the headlines']] }, () => {
  const rows = [['Yield curve', 'Currently reassuring', 'gain'], ['Employment', 'Weakening', 'soft'], ['Inflation', 'Stubborn', 'soft'], ['Credit', 'Watch closely', 'soft'], ['Growth', 'Still expanding', 'gain']];
  return P(CL, 226, `<span class="mono pen">The 2026 recession dashboard</span>`, { in: 695.9 }) + P(CR, 228, `<span class="tag tag-asof">Data as of Oct 8, 2026</span>`, { w: 400, style: 'margin-left:-400px;text-align:right', in: 696.0 }) +
    rows.map(([n, s, cls], i) => { const y = 282 + i * 52, dot = cls === 'gain' ? 'var(--gain)' : 'var(--marker)'; return P(560, y, `<span style="display:inline-block;width:22px;height:22px;border-radius:50%;background:${dot};box-shadow:inset 0 0 0 3px var(--ink);vertical-align:middle;margin-right:18px"></span><span class="micro" style="color:var(--ink);font-size:20px;vertical-align:middle">${n}</span>`, { in: 696.5 + i * 0.3 }) + P(900, y - 4, `<span class="text ${cls === 'gain' ? 'gain' : ''}" style="font-size:30px">${s}</span>`, { in: 696.5 + i * 0.3 }); }).join('') +
    P(560, 566, `<div class="chip chip-marker">Overall: moderate recession risk</div>`, { in: 698.4 }) + P(1080, 548, `<div class="body" style="font-size:26px;line-height:1.4">“The economy isn't in recession. But the next few quarters could tell us a lot.”</div>`, { w: 440, in: 699.2 });
});
scene(VOICE_LEN, VOICE_LEN + END_CARD, 'board', {}, () => {
  const t = VOICE_LEN;
  return P(960, 300, `<div style="font-family:var(--font-display);font-weight:800;font-size:150px;letter-spacing:-.03em;line-height:1"><span style="color:var(--ink)" ${at(t + 0.2)}>Simple</span><span style="color:var(--pen)" ${at(t + 0.45)}>Money</span></div>`, { c: 1, w: 1600 }) +
    P(960, 560, `<div style="display:flex;gap:28px;justify-content:center"><span class="btn" ${at(t + 1.0)}>Like</span><span class="btn" ${at(t + 1.2)}>Share</span><span class="btn btn-primary" ${at(t + 1.4)}>Subscribe</span></div>`, { c: 1, w: 1200 }) +
    P(960, 760, `<span class="mono soft">Money, made simple</span>`, { c: 1, w: 1200, in: t + 2.0 });
});

// ---------------------------------------------------------------------------
// Build the DOM
// ---------------------------------------------------------------------------
SC.sort((a, b) => a.t0 - b.t0);
const host = $('scenes');
SC.forEach((s, i) => {
  const d = document.createElement('div'); d.className = 'scene'; d.style.visibility = 'hidden';
  d.innerHTML = s.build(); host.appendChild(d); s.el = d;
  s.ins = [...d.querySelectorAll('[data-in]')]; s.words = []; s.dynamic = [...d.querySelectorAll('[data-draw],[data-reveal],[data-count],[data-swipe],[data-strike],[data-grow],[data-rot],[data-arc],[data-fly],[data-dim],[data-dimto],[data-out]')];
  s.dynamic.forEach(e => { if (e.dataset.draw != null || e.dataset.arc != null) { try { const L = e.getTotalLength(); e.dataset.len = L; e.style.strokeDasharray = `${L} ${L}`; e.style.strokeDashoffset = L; } catch (_) {} } });
  s.caps = (s.cap || []).map(([t, txt]) => ({ t, words: txt.split(' ').map(w => { const tone = w.startsWith('*') ? 'pen' : w.startsWith('!') ? 'loss' : w.startsWith('_') ? 'soft' : 'ink'; return { w: w.replace(/[*!_]/g, ''), tone }; }) }));
});
// beat dots: every caption is one beat; counted per nav chapter
const navBeats = NAV.map(() => []);
SC.filter(s => s.kind === 'frame').forEach(s => s.caps.forEach(c => navBeats[s.nav].push(c.t)));
// nav tabs
NAV.forEach((n, i) => { const t = document.createElement('div'); t.className = 'tab'; t.style.left = i * 320 + 'px'; t.textContent = n; t.dataset.i = i; $('nav').appendChild(t); });

function sceneAt(u) { for (let i = SC.length - 1; i >= 0; i--) if (u >= SC[i].t0) return i; return 0; }
function secOf(s, u) { let sec = s.sec, title = null; (s.secAt || []).forEach(([t, n, ttl]) => { if (u >= t) { sec = n; title = typeof ttl === 'string' ? ttl : null; } }); return { sec, title }; }

function render(t) {
  const u = t - OFF;
  const cur = sceneAt(u), S = SC[cur];
  SC.forEach((s, i) => { s.el.style.visibility = (i === cur || (i === cur - 1 && u < s.t1 + 0.01)) ? 'visible' : 'hidden'; });
  const out = s => 1 - clamp((u - (s.t1 - BEAT_OUT)) / BEAT_OUT);
  [S].forEach(s => {
    const o = out(s);
    s.ins.forEach(e => { const k = settle(clamp((u - +e.dataset.in) / BEAT_IN)); e.style.opacity = k * o; if (!(e instanceof SVGElement) || e.tagName === 'g' || e.tagName === 'text' || e.tagName === 'circle' || e.tagName === 'path' || e.tagName === 'rect' || e.tagName === 'line') e.style.transform = `translateY(${(1 - k) * 24}px)`; });
    s.dynamic.forEach(e => {
      const D = e.dataset;
      if (D.draw != null) { const [t0, d] = D.draw.split(',').map(Number); const k = push(clamp((u - t0) / d)); e.style.strokeDashoffset = D.len * (1 - k); if (D.in == null) e.style.opacity = (k > 0 ? 1 : 0) * o; }
      if (D.arc != null) { const [t0, d] = D.arc.split(',').map(Number); const k = push(clamp((u - t0) / d)); e.style.strokeDashoffset = D.len * (1 - k); }
      if (D.reveal != null) { const [t0, d, W] = D.reveal.split(',').map(Number); e.setAttribute('width', W * push(clamp((u - t0) / d))); }
      if (D.count != null) { const [a, b, dec, t0, d, plus] = D.count.split(',').map(Number); const k = push(clamp((u - t0) / d)); e.textContent = D.pre + fmtNum(a + (b - a) * k, dec, plus) + D.suf; }
      if (D.swipe != null) e.style.transform = `scaleX(${settle(clamp((u - +D.swipe) / 0.38))})`;
      if (D.strike != null) e.style.transform = `scaleX(${push(clamp((u - +D.strike) / 0.35))})`;
      if (D.grow != null) { const [t0, d, ax] = D.grow.split(','); const k = push(clamp((u - +t0) / +d)); e.style.transform = ax === 'x' ? `scaleX(${k})` : `scaleY(${k})`; e.style.opacity = (k > 0 ? 1 : 0) * o; }
      if (D.rot != null) { const [t0, d, a0, a1, cx, cy] = D.rot.split(',').map(Number); const k = (a1 > 50 ? bez(0.5, 0, 0.9, 0.6) : push)(clamp((u - t0) / d)); e.setAttribute('transform', `rotate(${a0 + (a1 - a0) * k} ${cx} ${cy})`); }
      if (D.fly != null) { const [sx, sy, tx, ty, t0] = D.fly.split(',').map(Number); const k = push(clamp((u - t0) / 1.6)); e.setAttribute('cx', sx + (tx - sx) * k); e.setAttribute('cy', sy + (ty - sy) * k); e.style.opacity = clamp((u - s.t0) / 0.4) * o; }
      if (D.dim != null) { const [t0, d, lo] = D.dim.split(',').map(Number); e.style.opacity = (1 - (1 - lo) * settle(clamp((u - t0) / d))) * o; }
      if (D.dimto != null) { const [t0, lo] = D.dimto.split(',').map(Number); e.style.opacity = 1 - (1 - lo) * settle(clamp((u - t0) / 0.5)); }
      if (D.out != null) { const k = 1 - clamp((u - +D.out) / BEAT_OUT); e.style.opacity = Math.min(+e.style.opacity || 1, k); if (k <= 0) e.style.opacity = 0; }
    });
    if (s.update) s.update(u, s.el);
  });

  // explainer frame chrome
  const isFrame = S.kind === 'frame';
  const prev = SC[cur - 1], next = SC[cur + 1];
  let fo = 1;
  if (isFrame && (!prev || prev.kind !== 'frame')) fo = settle(clamp((u - S.t0) / BEAT_IN));
  if (isFrame && (!next || next.kind !== 'frame')) fo *= 1 - clamp((u - (S.t1 - BEAT_OUT)) / BEAT_OUT);
  $('frame').style.opacity = isFrame ? fo : 0;
  if (isFrame) {
    const { sec, title } = secOf(S, u), [ttl, kick] = SECS[sec];
    // header swaps with a fade on a chapter change
    const nextSec = next && next.kind === 'frame' ? secOf(next, next.t0).sec : -1;
    let ho = 1;
    const chStart = Math.max(S.t0, ...(S.secAt || []).map(x => x[0]).filter(x => x <= u));
    const prevSec = prev && prev.kind === 'frame' ? secOf(prev, prev.t1 - 0.01).sec : -1;
    if (chStart > S.t0 || prevSec !== sec) ho = settle(clamp((u - chStart) / 0.8));
    if (nextSec !== sec && next && next.kind === 'frame') ho *= 1 - clamp((u - (S.t1 - BEAT_OUT)) / BEAT_OUT);
    $('header').style.opacity = ho;
    $('hTitle').textContent = title || ttl; $('hKick').textContent = title ? 'What to watch next' : kick; $('hCount').textContent = `Point ${String(sec).padStart(2, '0')} / 14`;
    // nav cut-out slides on chapter change
    const prevNav = prev && prev.kind === 'frame' ? prev.nav : S.nav;
    const navK = push(clamp((u - S.t0) / 0.8));
    const pos = prevNav + (S.nav - prevNav) * navK;
    $('navCut').style.left = pos * 320 + 'px';
    $('nav').querySelectorAll('.tab').forEach(tb => tb.classList.toggle('on', +tb.dataset.i === Math.round(pos)));
    // caption: the latest caption of this scene, built word by word
    const cap = [...S.caps].reverse().find(c => u >= c.t);
    const nextCap = S.caps.find(c => c.t > u);
    const capEl = $('caption');
    if (cap) {
      const key = S.t0 + ':' + cap.t;
      if (capEl.dataset.key !== key) { capEl.dataset.key = key; capEl.innerHTML = cap.words.map(w => `<span class="w">${w.w}</span>`).join(' '); }
      const fade = nextCap ? 1 - clamp((u - (nextCap.t - 0.2)) / 0.2) : 1 - clamp((u - (S.t1 - BEAT_OUT)) / BEAT_OUT);
      [...capEl.children].forEach((sp, i) => { const t0 = cap.t + i * 0.18, k = settle(clamp((u - t0) / WORD_STEP)), c2 = settle(clamp((u - t0 - WORD_STEP) / 0.25)); sp.style.opacity = k * fade; sp.style.transform = `translateY(${(1 - k) * 16}px)`; sp.style.color = mix(COLORS.faint, COLORS[cap.words[i].tone], c2); });
    } else { capEl.innerHTML = ''; capEl.dataset.key = ''; }
    // beat dots
    const beats = navBeats[S.nav];
    const idx = beats.filter(b => b <= u).length - 1;
    const dots = $('dots');
    if (dots.children.length !== beats.length) dots.innerHTML = beats.map(() => '<i></i>').join('');
    [...dots.children].forEach((d, i) => { d.className = i === idx ? 'on' : i > idx ? 'todo' : ''; });
  }
}

window.DURATION = DURATION;
window.OFF = OFF;
window.render = render;
window.ready = document.fonts.ready.then(() => { render(0); return true; });
if (!navigator.webdriver) { const start = performance.now(); (function loop() { render(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); })(); }
</script>
</body>
</html>
